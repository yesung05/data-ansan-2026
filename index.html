<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>돼지 저금통 공장 라인 — 센서 모니터</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--color-bg); color: var(--color-text);
    font-family: var(--font-body), sans-serif;
    display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto 1fr;
    overflow: hidden;
  }
  three-d-stage:not(:defined) { visibility: hidden; }

  header {
    grid-column: 1 / -1; display: flex; align-items: baseline; gap: var(--space-6);
    padding: var(--space-4) var(--space-6); border-bottom: 2px solid var(--color-text);
  }
  header h1 { font: 800 22px/1 var(--font-heading), sans-serif; margin: 0; letter-spacing: -0.02em; }
  header .sub { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
  header .spacer { flex: 1; }
  .line-switcher { display: flex; gap: 4px; align-items: center; }
  .line-btn {
    appearance: none; border: 2px solid var(--color-text); background: var(--color-bg); color: var(--color-text);
    font: 700 11px/1 var(--font-heading), sans-serif; letter-spacing: 0.1em;
    padding: 8px 14px; cursor: pointer;
  }
  .line-btn:hover { background: var(--color-neutral-200); }
  .line-btn.on { background: var(--color-text); color: var(--color-bg); }
  .line-btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  #btn-stats, #btn-overview {
    appearance: none; border: 2px solid var(--color-text); background: var(--color-bg); color: var(--color-text);
    font: 700 11px/1 var(--font-heading), sans-serif; letter-spacing: 0.06em;
    padding: 8px 14px; cursor: pointer;
  }
  #btn-stats:hover, #btn-overview:hover { background: var(--color-neutral-200); }
  #btn-stats:focus-visible, #btn-overview:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  #btn-resume {
    display: none; appearance: none; width: 100%; margin-top: 12px;
    border: 2px solid #fff; background: transparent; color: #fff;
    font: 700 13px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.06em;
    padding: 12px 16px; text-align: left; cursor: pointer;
  }
  #btn-resume:hover { background: rgba(255,255,255,0.15); }
  #btn-resume:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  body.alarm #btn-resume { display: block; }
  .counters { display: flex; gap: var(--space-6); }
  .counters div { display: flex; align-items: baseline; gap: 6px; }
  .counters span { font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; opacity: 0.6; }
  .counters b { font: 600 18px/1 var(--font-heading), sans-serif; font-variant-numeric: tabular-nums; }

  main { position: relative; border-right: 2px solid var(--color-text); min-width: 0; }
  three-d-stage { width: 100%; height: 100%; display: block; }
  .phase {
    position: absolute; left: var(--space-6); top: var(--space-6);
    display: flex; align-items: center; gap: 10px;
    background: var(--color-text); color: var(--color-bg);
    padding: 9px 16px; font-size: 13px; letter-spacing: 0.03em;
  }
  .phase::before { content: ""; width: 8px; height: 8px; background: var(--color-accent); }
  body.alarm .phase { background: var(--color-accent); color: #fff; }
  body.alarm main::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 6px var(--color-accent); animation: flash 0.9s steps(2, jump-none) infinite;
  }
  @keyframes flash { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0.12 } }

  aside { overflow-y: auto; scrollbar-gutter: stable; display: flex; flex-direction: column; min-height: 0; }
  .status { padding: var(--space-4) var(--space-6); border-bottom: 2px solid var(--color-text); }
  .status .k { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
  .status .v { font: 800 22px/1.15 var(--font-heading), "Noto Sans KR", sans-serif; margin-top: 4px; }
  .status .n { font-size: 12px; margin-top: 6px; opacity: 0.75; text-wrap: pretty; }
  body.alarm .status { background: var(--color-accent); color: #fff; }
  body.alarm .status .k, body.alarm .status .n { opacity: 0.9; }


  .grp { border-bottom: 2px solid var(--color-text); padding: var(--space-4) var(--space-6) var(--space-6); }
  .grp-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: var(--space-4); }
  .grp-n { font: 600 10px/1 var(--font-heading), sans-serif; letter-spacing: 0.1em; color: var(--color-accent); }
  .grp h2 { font: 700 13px/1 var(--font-heading), "Noto Sans KR", sans-serif; margin: 0; letter-spacing: 0.02em; }

  /* ---- 제품 생산 이력 ---- */
  .grp-h #btn-copy-log {
    margin-left: auto; appearance: none; cursor: pointer;
    border: 1px solid var(--color-divider); background: var(--color-bg); color: var(--color-text);
    font: 600 10px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.04em;
    padding: 5px 9px;
  }
  .grp-h #btn-copy-log:hover { background: var(--color-accent-200); }
  .grp-h #btn-copy-log:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .hist-empty { font-size: 11px; opacity: 0.6; margin: 0; text-wrap: pretty; }
  .hist-empty[hidden] { display: none; }
  #hist-list { display: flex; flex-direction: column; gap: 10px; }
  .hist { border: 1px solid var(--color-divider); border-left: 3px solid var(--color-text); padding: 9px 11px; }
  .hist[data-result="불량"] { border-left-color: var(--color-accent); }
  .hist-h { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .hist-no { font: 700 12px/1 var(--font-heading), sans-serif; font-variant-numeric: tabular-nums; }
  .hist-tag {
    font: 600 9px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.08em;
    padding: 3px 6px; background: var(--color-text); color: var(--color-bg);
  }
  .hist[data-result="불량"] .hist-tag { background: var(--color-accent); color: #fff; }
  .hist-time { margin-left: auto; font-size: 9.5px; opacity: 0.55; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
  .hist-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px 8px; margin: 0; }
  .hist-grid > div { padding: 3px 0; min-width: 0; }
  .hist-grid dt { font-size: 9px; opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-grid dd {
    margin: 1px 0 0; font: 600 12px/1.1 var(--font-heading), sans-serif;
    font-variant-numeric: tabular-nums;
  }
  .hist-grid dd i { font-style: normal; font-size: 8.5px; font-weight: 400; opacity: 0.55; margin-left: 2px; }
  .hist-grid .over dt, .hist-grid .over dd { color: var(--color-accent-700); }
  .hist-grid .over dd::after { content: " ▲"; font-size: 8px; }

  .row { padding: 10px 0; border-top: 1px solid var(--color-divider); }
  .row:first-of-type { border-top: 0; }
  .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row-label { font-size: 12px; font-weight: 500; }
  .row-val { font-variant-numeric: tabular-nums; }
  .row-val b { font: 600 15px/1 var(--font-heading), sans-serif; }
  .row-val i { font-style: normal; font-size: 10px; opacity: 0.6; letter-spacing: 0.06em; }
  .bar { position: relative; height: 10px; background: var(--color-neutral-200); margin: 7px 0 4px; }
  .bar-fill { height: 100%; width: 0; background: var(--color-text); transition: width 0.12s linear; }
  .bar-tick { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--color-accent); }
  .row.bad .bar-fill { background: var(--color-accent); }
  .row.bad .row-label { color: var(--color-accent-700); font-weight: 700; }
  .row.bad .row-val b { color: var(--color-accent-700); }
  .row-scale { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: 0.08em; opacity: 0.55; }
  .row-scale .lim { color: var(--color-accent-700); opacity: 1; }

  input[type="range"] { appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: ew-resize; }
  input[type="range"]:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--color-divider); }
  input[type="range"]::-webkit-slider-thumb { appearance: none; width: 10px; height: 18px; margin-top: -8px; background: var(--color-text); border: 0; }
  .row.bad input[type="range"]::-webkit-slider-thumb { background: var(--color-accent); }
  input[type="range"]::-moz-range-track { height: 2px; background: var(--color-divider); }
  input[type="range"]::-moz-range-thumb { width: 10px; height: 18px; border-radius: 0; background: var(--color-text); border: 0; }

  /* ============ 공장 전경 관리 페이지 (슬라이드 인) ============ */
  .overview {
    position: fixed; inset: 0 0 0 64px; z-index: 40; background: var(--color-bg); color: var(--color-text);
    display: grid; grid-template-columns: 1fr 400px; grid-template-rows: auto minmax(0, 1fr);
    transform: translateX(100%); transition: transform 780ms cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: -14px 0 40px rgba(32, 30, 29, 0.18); visibility: hidden;
  }
  .overview.open { transform: none; visibility: visible; }

  .ov-head {
    grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-6);
    padding: var(--space-4) var(--space-6); border-bottom: 2px solid var(--color-text);
  }
  .ov-head h1 { font: 800 20px/1 var(--font-heading), "Noto Sans KR", sans-serif; margin: 0; letter-spacing: -0.01em; }
  .ov-head .sub { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; margin-top: 4px; }
  .ov-head .spacer { flex: 1; }
  .ov-meta { display: flex; align-items: baseline; gap: 10px; }
  .ov-meta span { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
  .ov-meta b { font: 600 16px/1 var(--font-heading), sans-serif; font-variant-numeric: tabular-nums; }
  .ov-back {
    appearance: none; border: 2px solid var(--color-text); background: var(--color-bg); color: var(--color-text);
    font: 600 12px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.04em;
    padding: 11px 16px; text-align: left; cursor: pointer;
  }
  .ov-back:hover { background: var(--color-text); color: var(--color-bg); }
  .ov-back:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

  .ov-plan { position: relative; border-right: 2px solid var(--color-text); padding: var(--space-6); min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .ov-plan-t { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.6; margin-bottom: var(--space-4); }
  .ov-svg { flex: 1; min-height: 0; display: flex; align-items: center; }
  .ov-svg svg { width: 100%; height: 100%; max-height: 100%; display: block; }
  .ov-legend { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.08em; opacity: 0.7; padding-top: var(--space-4); border-top: 1px solid var(--color-divider); }
  .ov-legend .lg { width: 12px; height: 6px; background: var(--color-text); }
  .ov-legend .lg:not(:first-child) { margin-left: var(--space-4); }
  .ov-legend .lg-bad { background: var(--color-accent); }
  .ov-legend .lg-belt { background: var(--color-neutral-400); }

  .ov-svg text { font-family: var(--font-heading), "Noto Sans KR", sans-serif; fill: var(--color-text); }
  .ov-svg .zone, .ov-svg .strip { font-size: 12px; letter-spacing: 0.14em; opacity: 0.55; text-anchor: middle; }
  .ov-svg .strip { text-anchor: start; font-size: 11px; }
  .ov-svg .ln { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; }
  .ov-svg .lnote { font-size: 11px; opacity: 0.6; }
  .ov-svg .belt { fill: var(--color-neutral-400); }
  .ov-svg .flow { stroke: var(--color-neutral-400); stroke-width: 6; }
  .ov-svg .box { fill: var(--color-bg); stroke: var(--color-text); stroke-width: 2; }
  .ov-svg .code { font-size: 13px; font-weight: 700; text-anchor: middle; letter-spacing: 0.04em; }
  .ov-svg .sname { font-size: 11px; text-anchor: middle; opacity: 0.7; }
  .ov-svg .pip { fill: var(--color-neutral-400); }
  .ov-svg .pip.bad { fill: var(--color-accent); }
  .ov-svg .st { cursor: pointer; }
  .ov-svg .st:hover .box { fill: var(--color-accent-100); }
  .ov-svg .st:focus-visible { outline: 2px solid var(--color-accent); }
  .ov-svg .ring { stroke: none; }
  .ov-svg .line.sel .box { stroke-width: 2.5; }
  .ov-svg .line.sel .ln { fill: var(--color-accent); }
  .ov-svg .line.alarm .band { fill: var(--color-accent-100); }
  .ov-svg .line.alarm .belt, .ov-svg .line.alarm .flow { fill: var(--color-accent); stroke: var(--color-accent); }
  .ov-svg .st.alarm .box { fill: var(--color-accent); stroke: var(--color-accent); }
  .ov-svg .st.alarm .code { fill: #fff; }
  .ov-svg .st.alarm .ring { stroke: var(--color-accent); stroke-width: 2; animation: ovring 1.4s ease-out infinite; }
  @keyframes ovring { 0% { opacity: 1; transform: scale(0.9) } 100% { opacity: 0; transform: scale(1.12) } }
  .ov-svg .st.alarm .ring { transform-box: fill-box; transform-origin: center; }

  .ov-peek {
    position: fixed; left: 0; top: 0; bottom: 0; width: 64px; z-index: 41; pointer-events: none;
    display: none; align-items: center; justify-content: center; border-right: 2px solid var(--color-text);
  }
  body.overview-on .ov-peek { display: flex; }
  .ov-peek span {
    writing-mode: vertical-rl; font: 600 10px/1 var(--font-body), "Noto Sans KR", sans-serif;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-text); opacity: 0.55;
    background: var(--color-bg); padding: 10px 3px;
  }

  .ov-alerts { position: absolute; bottom: var(--space-6); right: var(--space-6); width: 330px; z-index: 3; }
  @media (max-width: 1180px) { .ov-alerts { width: 268px; } }
  .ov-alerts:empty { display: none; }
  .ov-alert { background: var(--color-accent); color: #fff; padding: 12px 16px; box-shadow: var(--shadow-lg); }
  .ov-alert-k { cursor: grab; user-select: none; }
  .ov-alert.dragging .ov-alert-k { cursor: grabbing; }
  .ov-alert-h { display: flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .ov-alert-t { margin-left: auto; font-variant-numeric: tabular-nums; opacity: 0.85; letter-spacing: 0.06em; }
  .ov-dot { width: 8px; height: 8px; background: #fff; animation: flash 0.9s steps(2, jump-none) infinite; }
  .ov-alert-line { font: 800 17px/1.25 var(--font-heading), "Noto Sans KR", sans-serif; margin: 7px 0 10px; }
  .ov-alert-rows { display: flex; flex-direction: column; }
  .ov-alert-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; border-top: 1px solid rgba(255, 255, 255, 0.35); font-size: 12px; }
  .ov-alert-row b { margin-left: auto; font: 600 14px/1 var(--font-heading), sans-serif; font-variant-numeric: tabular-nums; }
  .ov-alert-row i { font-style: normal; font-size: 10px; opacity: 0.8; letter-spacing: 0.06em; }
  .ov-alert-a { display: flex; gap: 8px; margin-top: 12px; }
  .ov-alert-a button {
    appearance: none; flex: 1; border: 2px solid #fff; background: transparent; color: #fff;
    font: 600 11px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.06em;
    padding: 10px 12px; text-align: left; cursor: pointer;
  }
  .ov-alert-a button:hover { background: #fff; color: var(--color-accent-700); }
  .ov-alert-a button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .ov-nav { overflow-y: auto; scrollbar-gutter: stable; min-height: 0; }
  .ov-lines { border-bottom: 2px solid var(--color-text); }
  .ov-line {
    display: flex; flex-direction: column;
    border-bottom: 1px solid var(--color-divider); background: var(--color-bg); color: var(--color-text);
    padding: 14px var(--space-6); font-family: var(--font-body), "Noto Sans KR", sans-serif;
  }
  .ov-line:last-child { border-bottom: 0; }
  .ov-line:hover { background: var(--color-neutral-200); }
  .ov-line-b { display: flex; flex-direction: column; gap: 4px; width: 100%; text-align: left;
    appearance: none; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  .ov-line-h { display: flex; align-items: center; gap: 10px; }
  .ov-line-h b { font: 700 14px/1 var(--font-heading), sans-serif; letter-spacing: 0.04em; }
  .ov-chip { font-style: normal; font-size: 10px; letter-spacing: 0.12em; padding: 4px 8px; margin-left: auto; background: var(--color-neutral-200); }
  .ov-line-n { font-size: 11px; opacity: 0.65; }
  .ov-line.on { background: var(--color-text); color: var(--color-bg); }
  .ov-line.on .ov-chip { background: rgba(255, 255, 255, 0.18); }
  .ov-line.on:hover { background: var(--color-text); }
  .ov-line.alarm .ov-chip { background: var(--color-accent); color: #fff; }
  .ov-graph {
    appearance: none; cursor: pointer; margin-top: 8px; width: 100%;
    border: 0; background: var(--color-text); color: var(--color-bg);
    font: 700 11px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.06em;
    padding: 9px 10px; text-align: left;
  }
  .ov-graph::before { content: "▤ "; }
  .ov-graph:hover { background: var(--color-accent); color: #fff; }
  .ov-graph:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .ov-graph[hidden] { display: none; }
  .ov-nav .grp { border-bottom: 2px solid var(--color-text); padding: var(--space-4) var(--space-6) var(--space-6); }
  .ov-nav .row-scale .lim { color: var(--color-accent-700); opacity: 1; }

  /* ================= 전경도 그래프 버튼 ================= */
  .ov-svg .gbtn { opacity: 0; pointer-events: none; transition: opacity 0.14s; }
  .ov-svg .line.sel .gbtn { opacity: 1; pointer-events: auto; cursor: pointer; }
  .ov-svg .gbtn rect { fill: var(--color-text); }
  .ov-svg .gbtn text { fill: var(--color-bg); font-size: 11px; font-weight: 700; text-anchor: middle; letter-spacing: 0.04em; }
  .ov-svg .line.sel .gbtn:hover rect { fill: var(--color-accent); }
  .ov-svg .gbtn:focus-visible rect { stroke: var(--color-accent); stroke-width: 2.5; }

  /* ================= 라인 통계 그래프 패널 ================= */
  .ovg { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, #201e1d 55%, transparent);
    display: flex; align-items: center; justify-content: center; padding: var(--space-6); }
  .ovg[hidden] { display: none; }
  .ovg-card { background: var(--color-bg); border: 2px solid var(--color-text); box-shadow: var(--shadow-lg);
    width: min(1080px, 100%); max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
  .ovg-head { display: flex; align-items: flex-start; gap: var(--space-4); padding: var(--space-4) var(--space-6);
    border-bottom: 2px solid var(--color-text); }
  .ovg-title { font: 800 20px/1.1 var(--font-heading), "Noto Sans KR", sans-serif; margin: 0; }
  .ovg-sub { margin: 5px 0 0; font-size: 11px; opacity: 0.65; }
  .ovg-tabs { margin-left: auto; display: flex; border: 1px solid var(--color-text); }
  .ovg-tab { appearance: none; cursor: pointer; border: 0; background: var(--color-bg); color: var(--color-text);
    font: 700 12px/1 var(--font-body), sans-serif; letter-spacing: 0.06em; padding: 10px 16px; }
  .ovg-tab + .ovg-tab { border-left: 1px solid var(--color-text); }
  .ovg-tab.on { background: var(--color-text); color: var(--color-bg); }
  .ovg-tab:focus-visible { outline: 2px solid var(--color-accent); outline-offset: -2px; }
  .ovg-x { appearance: none; cursor: pointer; border: 1px solid var(--color-text); background: var(--color-bg);
    color: var(--color-text); font-size: 13px; line-height: 1; padding: 9px 11px; }
  .ovg-x:hover { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
  .ovg-x:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .ovg-kpis { display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 2px solid var(--color-text); }
  .ovg-kpi { padding: 12px var(--space-4); border-right: 1px solid var(--color-divider); }
  .ovg-kpi:last-child { border-right: 0; }
  .ovg-kpi span { display: block; font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.6; }
  .ovg-kpi b { display: block; margin-top: 5px; font: 800 21px/1 var(--font-heading), sans-serif; font-variant-numeric: tabular-nums; }
  .ovg-kpi i { font-style: normal; font-size: 11px; font-weight: 400; opacity: 0.55; margin-left: 3px; }
  .ovg-scroll { position: relative; overflow-y: auto; min-height: 0; flex: 1; }
  .ovg-body { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-8); }
  .ovg-c h3 { font: 700 13px/1 var(--font-heading), "Noto Sans KR", sans-serif; margin: 0 0 8px; letter-spacing: 0.02em; }
  .ovg-legend { display: flex; gap: 16px; margin: 0 0 10px; font-size: 11px; opacity: 0.8; }
  .ovg-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .ovg-legend i { width: 13px; height: 4px; display: block; }
  .ovg-plot svg { width: 100%; height: auto; display: block; }
  .ovg-plot .g-grid { stroke: var(--color-neutral-300); stroke-width: 1; }
  .ovg-plot .g-target { stroke: var(--color-accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .ovg-plot .g-line { fill: none; stroke: var(--color-neutral-700); stroke-width: 2; stroke-linejoin: round; }
  .ovg-plot .g-dot { stroke: var(--color-bg); stroke-width: 2; }
  .ovg-plot text { font-family: var(--font-body), sans-serif; fill: var(--color-text); }
  .ovg-plot .g-tick { font-size: 10px; opacity: 0.6; font-variant-numeric: tabular-nums; }
  .ovg-plot .g-val { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .ovg-plot .g-note { font-size: 10px; font-weight: 700; fill: var(--color-accent-700); }
  .ovg-tip { position: absolute; pointer-events: none; opacity: 0; transition: opacity 0.1s;
    background: var(--color-text); color: var(--color-bg); padding: 7px 10px; font-size: 11px; line-height: 1.55;
    white-space: nowrap; transform: translate(-50%, -115%); z-index: 5; font-variant-numeric: tabular-nums; }
  .ovg-details { border-top: 1px solid var(--color-divider); padding-top: var(--space-4); }
  .ovg-details summary { cursor: pointer; font: 700 12px/1 var(--font-body), sans-serif; letter-spacing: 0.04em; }
  .ovg-details summary:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .ovg-table { width: 100%; border-collapse: collapse; margin-top: var(--space-4); font-size: 12px; }
  .ovg-table caption { text-align: left; font-size: 10.5px; opacity: 0.6; padding-bottom: 8px; }
  .ovg-table th, .ovg-table td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--color-divider); font-variant-numeric: tabular-nums; }
  .ovg-table thead th { text-align: right; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.6; }
  .ovg-table th[scope="row"], .ovg-table thead th:first-child { text-align: left; }
  .ovg-table tr.live th[scope="row"] { color: var(--color-accent-700); font-weight: 700; }
  .ovg-table tr.live i { font-style: normal; font-size: 9px; }
  .ovg-disclaimer { font-size: 10.5px; opacity: 0.62; margin: 0; text-wrap: pretty; line-height: 1.6; }
  .ovg-foot { border-top: 2px solid var(--color-text); padding: var(--space-4) var(--space-6);
    display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
  .ovg-foot button { appearance: none; cursor: pointer; border: 1px solid var(--color-text);
    background: var(--color-bg); color: var(--color-text);
    font: 700 12px/1 var(--font-body), "Noto Sans KR", sans-serif; letter-spacing: 0.04em; padding: 11px 16px; }
  .ovg-foot button:hover { background: var(--color-text); color: var(--color-bg); }
  .ovg-foot button:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .ovg-mail.on { background: var(--color-accent); border-color: var(--color-accent); color: #fff; }
  .ovg-mail.on:hover { background: var(--color-accent-600); border-color: var(--color-accent-600); }
  /* AI 요약 섹션 */
  .ovg-ai { background: color-mix(in srgb, var(--color-accent) 6%, var(--color-surface)); border-left: 3px solid var(--color-accent);
    padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); }
  .ovg-ai[hidden] { display: none; }
  .ovg-ai-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--color-accent); background: var(--color-accent-100); padding: 2px 8px; margin-bottom: var(--space-2); }
  .ovg-ai-summary { margin: 0 0 var(--space-2); font-size: 13.5px; line-height: 1.65; font-weight: 500; color: var(--color-text); }
  .ovg-ai-imps { margin: 0 0 var(--space-2); padding-left: var(--space-4); font-size: 12.5px; line-height: 1.7; color: var(--color-text); opacity: 0.88; }
  .ovg-ai-imps li { margin-bottom: 2px; }
  .ovg-ai-ts { margin: 0; font-size: 10px; opacity: 0.45; }
  .ovg-ai-loading { font-size: 12px; opacity: 0.6; }
  .ovg-ai-err { font-size: 12px; color: var(--color-accent-700); }
  .ovg-sub-panel { flex: 1 0 100%; border-top: 1px solid var(--color-divider); padding-top: var(--space-4);
    display: flex; flex-direction: column; gap: 10px; }
  .ovg-sub-panel[hidden] { display: none; }
  .ovg-field { display: flex; align-items: center; gap: 10px; }
  .ovg-field label { font-size: 11px; font-weight: 600; min-width: 96px; }
  .ovg-field input, .ovg-field select { flex: 1; max-width: 320px; font: 400 13px/1 var(--font-body), sans-serif;
    padding: 9px 10px; border: 1px solid var(--color-divider); background: var(--color-neutral-100); color: var(--color-text); }
  .ovg-field input:focus-visible, .ovg-field select:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 1px; }
  .ovg-field-n { font-size: 11px; opacity: 0.65; margin: 0; }
  .ovg-sub-a { display: flex; gap: 10px; }
  .ovg-sub-msg { margin: 0; font-size: 11.5px; min-height: 1.2em; }
  .ovg-sub-msg.ok { color: var(--color-accent-700); font-weight: 600; }
  .ovg-sub-msg.bad { color: var(--color-accent); font-weight: 700; }
  .ovg-print-h { display: none; font-size: 11px; letter-spacing: 0.06em; padding: 8px var(--space-6) 0; margin: 0; opacity: 0.7; }
  @media (max-width: 900px) {
    .ovg-kpis { grid-template-columns: repeat(2, 1fr); }
    .ovg-head { flex-wrap: wrap; }
  }
  @media print {
    body.printing-stats { background: #fff; overflow: visible; display: block; height: auto; }
    body.printing-stats > *:not(.ovg) { display: none !important; }
    body.printing-stats .ovg { position: static; inset: auto; padding: 0; background: none; display: block; }
    body.printing-stats .ovg-card { border: 0; box-shadow: none; width: 100%; max-height: none; display: block; }
    body.printing-stats .ovg-tabs, body.printing-stats .ovg-x,
    body.printing-stats .ovg-foot, body.printing-stats .ovg-tip { display: none !important; }
    body.printing-stats .ovg-print-h { display: block; }
    body.printing-stats .ovg-scroll { overflow: visible; }
    body.printing-stats .ovg-body { padding: 0; gap: 18px; }
    body.printing-stats .ovg-c, body.printing-stats .ovg-table { break-inside: avoid; }
    body.printing-stats .ovg-details summary { display: none; }
    @page { size: A4 portrait; margin: 14mm; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>돼지 저금통 공장 라인</h1>
    <div class="sub">Piggy bank line · sensor monitor</div>
  </div>
  <div class="spacer"></div>
  <button id="btn-stats">통계 그래프</button>
  <button id="btn-overview">공장 전경</button>
  <div class="line-switcher">
    <button class="line-btn on" data-line="A">LINE A</button>
    <button class="line-btn" data-line="B">LINE B</button>
    <button class="line-btn" data-line="C">LINE C</button>
  </div>
  <div class="counters">
    <div><span>사이클</span><b id="c-cycle">0</b></div>
    <div><span>완성</span><b id="c-done">0</b></div>
    <div><span>불량</span><b id="c-reject">0</b></div>
  </div>
</header>

<main>
  <three-d-stage name="piggybank_factory_line" background="#f3f2f2"></three-d-stage>
  <div class="phase" id="phase">대기</div>
</main>

<aside>
  <div class="status">
    <div class="k">라인 상태</div>
    <div class="v" id="status">대기</div>
    <div class="n" id="status-note">전 센서 정상 범위</div>
    <button id="btn-resume">▶ 라인 재가동</button>
  </div>
  <div class="controls" hidden aria-hidden="true">
    <button id="btn-run">▶ 정상 사이클 실행</button>
    <button id="btn-fault">⚠ 경고 사이클</button>
    <button id="btn-reset">⟲ 초기화</button>
  </div>
  <div id="sensors"></div>

  <section class="grp" id="history">
    <div class="grp-h">
      <span class="grp-n">04</span>
      <h2>제품 생산 이력</h2>
      <button id="btn-copy-log" type="button">이력 복사</button>
    </div>
    <p class="hist-empty" id="hist-empty">아직 완성된 제품이 없습니다. 사이클을 실행하면 제품마다 센서 9종 값이 기록됩니다.</p>
    <div id="hist-list"></div>
  </section>
</aside>

<script src="js/three-d-stage.js"></script>
<script src="js/line-stats.js"></script>
<script src="js/plant-overview.js"></script>
<script type="module" src="js/piggy-line.js"></script>
</body>
</html>
